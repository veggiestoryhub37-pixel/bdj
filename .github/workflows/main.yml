
name: Build TikTok SIM Spoof

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          echo "Using: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Extract source ZIP
        run: |
          mkdir -p source
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -1)
          unzip -q "$ZIP" -d source

      - name: Build APK
        run: |
          GRADLEW=$(find source -name gradlew -type f | head -1)
          DIR=$(dirname "$GRADLEW")
          cd "$DIR"
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TikTok-SIM-Spoof-APK
          path: source/**/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
