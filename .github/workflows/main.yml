
name: Build TikTok SIM Spoof

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Locate source
        run: |
          if ! find . -name gradlew -type f | grep -q .; then
            ZIP=$(find . -name '*.zip' -type f | head -1)
            if [ -n "$ZIP" ]; then
              mkdir -p extracted
              unzip -q "$ZIP" -d extracted
            fi
          fi
          find . -name gradlew -type f

      - name: Build APK
        run: |
          GRADLEW=$(find . -name gradlew -type f | head -1)
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: Gradle wrapper not found"
            exit 1
          fi
          DIR=$(dirname "$GRADLEW")
          cd "$DIR"
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew --no-daemon assembleRelease

      - name: Collect APK
        run: |
          mkdir -p output
          find . -path '*/build/outputs/apk/release/*.apk' \
            -exec cp {} output/ \;
          ls -lh output

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TikTok-SIM-Spoof-APK
          path: output/*.apk
          if-no-files-found: error
          
